[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gwproject"
version = "2.0.0"
description = "Pipeline auditavel para catalogos de ondas gravitacionais, morfologia e robustez open-world"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "pandas>=2.1,<3",
  "matplotlib>=3.8,<4",
  "h5py>=3.10,<4",
  "requests>=2.31,<3",
  "truststore>=0.10,<1; platform_system == 'Windows'",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
gw = ["gwpy>=3.0,<5", "gwosc>=0.7,<1"]
ml = [
  "scikit-learn>=1.4,<2",
  "pillow>=10,<13",
  "torch>=2.5,<3",
  "torchvision>=0.20,<1",
]
test = ["pytest>=8,<10", "pytest-cov>=5,<7"]
all = [
  "gwpy>=3.0,<5",
  "gwosc>=0.7,<1",
  "scikit-learn>=1.4,<2",
  "pillow>=10,<13",
  "torch>=2.5,<3",
  "torchvision>=0.20,<1",
]

[project.scripts]
gwproject = "gwproject.cli:main"
gwproject-research = "gwproject.research_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# "." expoe o kit didatico gw_student_kit, que fica fora do pacote.
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q -m 'not benchmark'"
markers = [
  "benchmark: teste dependente do hardware; executar separadamente",
  "network: teste que requer acesso externo",
]

[tool.coverage.run]
omit = [
  "src/gwproject/commands/*",
  "src/gwproject/cli.py",
  "src/gwproject/research_cli.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
