[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gwproject-v8"
version = "0.9.0"
license = {text = "MIT"}
description = "Pipeline auditavel de catalogo GWTC e programa open-world de robustez para glitches"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "pandas>=2.1,<3",
  "matplotlib>=3.8,<4",
  "h5py>=3.10,<4",
  "requests>=2.31,<3",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
gw = ["gwpy>=3.0,<5", "gwosc>=0.7,<1"]
# PyTorch/torchvision com CUDA sao instalados por scripts/install_gpu_windows.ps1
ml = ["scikit-learn>=1.4,<2", "pillow>=10,<13", "opencv-python>=4.8,<4.10"]
test = ["pytest>=8,<10"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q -m 'not benchmark'"
markers = [
  "benchmark: teste dependente do hardware; executar separadamente",
  "network: teste que requer acesso externo",
]
